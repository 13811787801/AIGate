# AIGate 配置示例 —— 复制为 config.yaml 后修改
# 文档：docs/部署与使用.md

server:
  host: "0.0.0.0"
  port: 3000
  mode: "debug" # debug | release

database:
  # sqlite（试用）或 mysql（正式）
  driver: "sqlite"
  # sqlite 路径；mysql 时忽略
  sqlite_path: "./data/aigate.db"
  # mysql 示例：
  # driver: "mysql"
  # dsn: "aigate:password@tcp(127.0.0.1:3306)/aigate?charset=utf8mb4&parseTime=True&loc=Local"

redis:
  enabled: false
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

auth:
  jwt_secret: "CHANGE_ME_TO_A_LONG_RANDOM_STRING"
  admin_username: "admin"
  # 首次启动若库中无管理员，将用此密码创建（请立刻修改）
  admin_password: "admin123"
  # Phase1 引导接口 Token；留空则禁用 X-Admin-Token（推荐）
  bootstrap_token: ""

security:
  # 渠道上游 Key AES 派生口令（请改成足够长的随机串）
  data_key: "CHANGE_ME_DATA_KEY"
  # release 模式下弱密钥默认拒绝启动；紧急可 true
  allow_insecure: false

billing:
  # 预扣安全边际（相对估算费用的比例）
  freeze_margin: 1.2

plugin:
  enabled: false
  base_url: "http://127.0.0.1:3100"
  timeout_ms: 200
  fail_open: true

# onprem = 自己的服务器：管理组织内账号与用量
# saas   = 面向外部用户：套餐与订阅
deploy:
  mode: "onprem"
  product_name: "AIGate"

# 功能开关。core / console 始终开启。
modules:
  marketplace: true
  wallet: true
  playground: true
  admin_channels: true
  billing_online: false   # 在线支付：SaaS/对外收费才开
  sso: false
  audit: false
  plugin_runtime: false

# 可选的实例许可证（Ed25519）。不需要许可证时保持 file 为空、require 为 false。
license:
  file: ""                 # 例如 ./configs/license.json
  public_key_b64: ""       # 发行方公钥
  require: false           # 生产可设 true：无有效许可证则拒绝启动

local_model:
  # 本地 OpenAI 兼容推理默认探测路径
  health_path: "/v1/models"

log:
  level: "info"
  file: "./logs/aigate.log"
